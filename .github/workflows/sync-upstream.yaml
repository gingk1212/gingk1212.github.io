name: Sync upstream
# 週1回、上流の更新に追従する:
#   - .github/workflows/hugo.yaml を Hugo 公式ドキュメントの内容に合わせる (Hugo のバージョン更新等)
#   - themes/PaperMod サブモジュールを上流の最新に更新する
# ビルドが通ることを確認したうえで main に push する (push により Build and deploy が走る)。
#
# 更新があった回だけ、更新内容の概要をまとめた Issue を作成する (GitHub モバイルアプリに通知が届く)。
# 更新がなかった回は何も通知しない。
#
# .github/workflows/ 配下は GITHUB_TOKEN では push できないため、
# secrets.WORKFLOW_UPDATE_TOKEN に PAT が必要:
#   - Fine-grained PAT: このリポジトリに対して Contents = Read and write, Workflows = Read and write
#   - Classic PAT の場合は repo + workflow スコープ
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
defaults:
  run:
    shell: bash
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DOC_SOURCE: https://raw.githubusercontent.com/gohugoio/hugoDocs/master/content/en/host-and-deploy/host-on-github-pages/index.md
      DOC_PAGE: https://gohugo.io/host-and-deploy/host-on-github-pages/
      TARGET: .github/workflows/hugo.yaml
      TZ: Asia/Tokyo
    steps:
      - name: Verify the token is configured
        env:
          TOKEN: ${{ secrets.WORKFLOW_UPDATE_TOKEN }}
        run: |
          if [[ -z "${TOKEN}" ]]; then
            echo "::error::secrets.WORKFLOW_UPDATE_TOKEN が未設定です。Contents と Workflows に write 権限を持つ PAT を登録してください。"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.WORKFLOW_UPDATE_TOKEN }}

      - name: Extract the workflow YAML from the Hugo docs
        run: |
          set -euo pipefail
          curl -sfL "${DOC_SOURCE}" -o "${RUNNER_TEMP}/docs.md"
          awk '/^[[:space:]]*```yaml/{f=1;next} f&&/^[[:space:]]*```/{exit} f{sub(/^  /,"");print}' \
            "${RUNNER_TEMP}/docs.md" > "${RUNNER_TEMP}/upstream.yaml"
          # 抽出に失敗したまま空ファイルで上書きしないよう、内容を検証する
          for marker in '^name: Build and deploy' '^  deploy:' 'actions/deploy-pages@' 'HUGO_VERSION:'; do
            if ! grep -q "${marker}" "${RUNNER_TEMP}/upstream.yaml"; then
              echo "::error::${DOC_PAGE} からのワークフロー抽出に失敗しました (ページ構成が変わった可能性があります)。"
              exit 1
            fi
          done

      - name: Read the tool versions
        id: versions
        run: |
          set -euo pipefail
          read_version() { # <file> <key>
            awk -F': *' -v k="${2}_VERSION" '$1 ~ "^ +"k"$" {print $2; exit}' "${1}" | tr -d '[:space:]'
          }
          for key in HUGO DART_SASS; do
            value="$(read_version "${RUNNER_TEMP}/upstream.yaml" "${key}")"
            if [[ -z "${value}" ]]; then
              echo "::error::${key}_VERSION をドキュメントから読み取れませんでした。"
              exit 1
            fi
            echo "${key,,}=${value}" >> "${GITHUB_OUTPUT}"
          done
          # 更新前の Hugo のバージョン。通知に載せるだけなので、読めなくてもここでは止めない。
          echo "hugo_before=$(read_version "${TARGET}" HUGO)" >> "${GITHUB_OUTPUT}"

      - name: Apply upstream updates
        id: apply
        env:
          HUGO_BEFORE: ${{ steps.versions.outputs.hugo_before }}
          HUGO_AFTER: ${{ steps.versions.outputs.hugo }}
          SUMMARY: ${{ runner.temp }}/summary.md
        run: |
          set -euo pipefail

          # 更新後にコミットログの差分を出すため、サブモジュールの更新前 SHA を控えておく。
          mapfile -t submodules < <(
            git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}' || true
          )
          declare -A before_sha
          for path in "${submodules[@]}"; do
            before_sha["${path}"]="$(git -C "${path}" rev-parse HEAD)"
          done

          cp "${RUNNER_TEMP}/upstream.yaml" "${TARGET}"
          git submodule update --remote --recursive

          if git diff --quiet -- "${TARGET}" themes; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "上流に更新はありません。"
            exit 0
          fi
          echo "changed=true" >> "${GITHUB_OUTPUT}"
          git diff --stat -- "${TARGET}" themes

          # ここから通知用のサマリ (Markdown) を組み立てる。
          # headline_parts は Issue のタイトルに使う「何が変わったか」の要約。
          headline_parts=()
          {
            echo "\`Sync upstream\` が上流の更新を \`${GITHUB_REF_NAME}\` に反映しました。"
            echo
          } > "${SUMMARY}"
          if [[ "${HUGO_BEFORE}" != "${HUGO_AFTER}" ]]; then
            headline_parts+=("Hugo ${HUGO_AFTER}")
            {
              echo "## Hugo"
              echo
              echo "${HUGO_BEFORE:-?} → ${HUGO_AFTER}"
              echo
              echo "リリースノート: https://github.com/gohugoio/hugo/releases/tag/v${HUGO_AFTER}"
              echo
            } >> "${SUMMARY}"
          else
            {
              echo "Hugo ${HUGO_AFTER} (変更なし)"
              echo
            } >> "${SUMMARY}"
          fi

          for path in "${submodules[@]}"; do
            old="${before_sha["${path}"]}"
            new="$(git -C "${path}" rev-parse HEAD)"
            if [[ "${old}" == "${new}" ]]; then
              continue
            fi
            headline_parts+=("$(basename "${path}") ${new:0:7}")
            url="$(git config -f .gitmodules --get "submodule.${path}.url" | sed 's/\.git$//')"
            count="$(git -C "${path}" rev-list --count "${old}..${new}" 2>/dev/null || echo '?')"
            {
              echo "## ${path}"
              echo
              echo "\`${old:0:7}\` → \`${new:0:7}\` (コミット ${count} 件)"
              echo
              # 上流が rebase 等をしていて old..new を辿れない場合はログを諦め、compare リンクだけ残す。
              git -C "${path}" log -n 50 --pretty='- %s (`%h`)' "${old}..${new}" 2>/dev/null \
                || echo "- (コミットログを取得できませんでした)"
              echo
              echo "変更全体: ${url}/compare/${old}...${new}"
              echo
            } >> "${SUMMARY}"
          done

          if ! git diff --quiet -- "${TARGET}"; then
            {
              echo "## ${TARGET}"
              echo
              echo "<details><summary>差分を表示</summary>"
              echo
              echo '```diff'
              git diff -- "${TARGET}"
              echo '```'
              echo
              echo "</details>"
              echo
            } >> "${SUMMARY}"
          fi

          title='Upstream sync'
          if ((${#headline_parts[@]} > 0)); then
            printf -v joined '%s, ' "${headline_parts[@]}"
            title="Upstream sync: ${joined%, }"
          fi
          echo "title=${title}" >> "${GITHUB_OUTPUT}"

          cat "${SUMMARY}" >> "${GITHUB_STEP_SUMMARY}"

      # push すると Build and deploy がそのまま走るため、先に実際にビルドできるか確かめる。
      # ここで落ちれば push されず、公開中のサイトは現状のまま維持される。
      - name: Smoke test the build
        if: steps.apply.outputs.changed == 'true'
        env:
          HUGO_VERSION: ${{ steps.versions.outputs.hugo }}
          DART_SASS_VERSION: ${{ steps.versions.outputs.dart_sass }}
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.local/hugo"
          curl -sfL --output-dir "${RUNNER_TEMP}" -O "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xf "${RUNNER_TEMP}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          curl -sfL --output-dir "${RUNNER_TEMP}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -C "${HOME}/.local/hugo" -xf "${RUNNER_TEMP}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          export PATH="${HOME}/.local/dart-sass:${HOME}/.local/hugo:${PATH}"
          git config --global core.quotepath false
          hugo version
          if ! hugo build --gc --minify --destination "${RUNNER_TEMP}/smoke-public"; then
            echo "::error::Hugo ${HUGO_VERSION} と最新テーマの組み合わせでビルドに失敗しました。push しません。手動で対応してください。"
            exit 1
          fi
          if [[ ! -s "${RUNNER_TEMP}/smoke-public/index.html" ]]; then
            echo "::error::ビルドは成功しましたが index.html が生成されませんでした。push しません。"
            exit 1
          fi

      - name: Commit and push
        if: steps.apply.outputs.changed == 'true'
        env:
          HUGO_VERSION: ${{ steps.versions.outputs.hugo }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${TARGET}" themes
          git commit -m "Sync with upstream (Hugo ${HUGO_VERSION})" \
            -m "hugo.yaml source: ${DOC_PAGE}" \
            -m "$(git submodule status --cached)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # 更新があった回だけ Issue を立てる。Watch している通知が GitHub モバイルアプリに届き、
      # 更新内容を後から読み返せる記録にもなる。
      - name: Open an issue with the summary
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SUMMARY: ${{ runner.temp }}/summary.md
          TITLE: ${{ steps.apply.outputs.title }}
        run: |
          set -euo pipefail
          {
            echo "---"
            echo
            echo "- コミット: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/$(git rev-parse HEAD)"
            echo "- 実行ログ: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${SUMMARY}"
          issue="$(gh issue create --title "${TITLE}" --body-file "${SUMMARY}")"
          echo "${issue}"
          # assign できなくても通知自体は届くので、失敗してもワークフローは落とさない。
          gh issue edit "${issue}" --add-assignee "${GITHUB_REPOSITORY_OWNER}" \
            || echo "::warning::Issue の assign に失敗しました: ${issue}"
